<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор вклада с капитализацией</title>
<meta name="description" content="Рассчитайте доход по банковскому вкладу с ежемесячной капитализацией или без неё.">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/site.js" defer></script>
</head>
<body>
<header>
<a href="index.html">💰 ФинКальк</a>
<nav><a href="slozhnyj-procent.html">Сложный процент</a><a href="kredit.html">Кредит</a><a href="vklad.html">Вклад</a><a href="passivnyj-dohod.html">Пассивный доход</a></nav>
</header>
<main>
<h1>Калькулятор вклада</h1>
<div class="card grid">
<label>Сумма вклада, ₽<input id="s" type="number" value="500000"></label>
<label>Ставка, % годовых<input id="r" type="number" value="16" step="0.1"></label>
<label>Срок, месяцев<input id="n" type="number" value="12"></label>
<label>Капитализация<select id="c"><option value="1">Ежемесячная</option><option value="0">Без капитализации</option></select></label>
</div>
<div class="card result" id="out"></div>
<p>Доход по вкладам сверх необлагаемого лимита облагается НДФЛ. Актуальный лимит уточняйте на сайте ФНС.</p>
<script>
document.addEventListener("DOMContentLoaded",()=>bindCalc(["s","r","n","c"],()=>{
  const S=num("s"),i=num("r")/100/12,n=num("n");
  const end=num("c")?S*Math.pow(1+i,n):S*(1+i*n);
  out.innerHTML=`Через ${n} мес.: <b>${fmt(end)}</b><br>Доход до налога: ${fmt(end-S)}`;
}));
</script>
<div class="ad"></div>
</main>
<footer>Расчёты носят справочный характер и не являются финансовой рекомендацией. © ФинКальк</footer>
</body>
</html>
